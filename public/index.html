<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nguyen Duc Thang — AI Engineer</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      The four absolute URLs below are the only place the site origin is repeated
      outside lib/i18n.ts (SITE_URL). Change the domain and both must be updated.
    -->
    <link rel="canonical" href="https://thangnd-portfolio.vercel.app/en/" />
    <link rel="alternate" hreflang="en" href="https://thangnd-portfolio.vercel.app/en/" />
    <link rel="alternate" hreflang="vi" href="https://thangnd-portfolio.vercel.app/vi/" />
    <link rel="alternate" hreflang="x-default" href="https://thangnd-portfolio.vercel.app/en/" />
    <meta name="robots" content="noindex, follow" />

    <!--
      Entry point for "/". Hand-written rather than a Next route: every route on
      the site lives under /[locale], and this file redirects into the right one
      before any framework JavaScript loads.

      English is the default. The only thing that overrides it is a locale the
      visitor previously chose with the language switcher.
    -->
    <script>
      (function () {
        var target = 'en';
        try {
          var saved = window.localStorage.getItem('portfolio.locale');
          if (saved === 'vi' || saved === 'en') target = saved;
        } catch (e) {
          /* storage blocked — fall through to English */
        }
        window.location.replace('/' + target + '/');
      })();
    </script>

    <noscript>
      <meta http-equiv="refresh" content="0; url=/en/" />
    </noscript>

    <style>
      html {
        background: #fbfbfa;
        color: #14181b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      a {
        color: #144e52;
        text-decoration-color: #d5d9d9;
        text-underline-offset: 4px;
      }
      p {
        display: flex;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <p>
      <a href="/en/" hreflang="en">English</a>
      <span aria-hidden="true" style="color: #d5d9d9">/</span>
      <a href="/vi/" hreflang="vi">Tiếng Việt</a>
    </p>
  </body>
</html>
